name: Android CI / Build APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  actions: read

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ☕ Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Install Node Dependencies
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund

      - name: ⚡ Build Web Assets
        run: |
          npm run build

      - name: 📱 Sync Capacitor Android Project
        run: |
          npx @capacitor/cli sync android || npx cap sync android

      - name: 🔑 Ensure Android Debug Keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: 🛠️ Make Gradlew Executable & Clean
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew clean --no-daemon

      - name: 🚀 Build Android Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 🔍 Locate Generated APK
        id: locate_apk
        shell: bash
        run: |
          mkdir -p build-output
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find android -name "*debug*.apk" -o -name "*.apk" | head -n 1)
          fi
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "::error::Could not find compiled Android APK"
            exit 1
          fi
          
          APK_NAME="BHAPUMA-AI-Assistant-v1.0.${{ github.run_number }}.apk"
          cp "$APK_PATH" "build-output/$APK_NAME"
          
          echo "apk_path=build-output/$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "APK successfully staged at build-output/$APK_NAME"

      - name: 📤 Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BHAPUMA-Android-APK-v1.0.${{ github.run_number }}
          path: ${{ steps.locate_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      - name: 🏷️ Publish GitHub Release Asset
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "BHAPUMA Android APK Release (v1.0.${{ github.run_number }})"
          body: |
            ## 🤖 BHAPUMA AI Assistant - Android APK Release

            - **Build Version:** `v1.0.${{ github.run_number }}`
            - **Commit SHA:** `${{ github.sha }}`
            - **Branch:** `${{ github.ref_name }}`

            ### 📲 कसरी इन्स्टल गर्ने (Installation Steps):
            1. तल **Assets** सेक्सनबाट **`${{ steps.locate_apk.outputs.apk_name }}`** डाउनलोड गर्नुहोस्।
            2. आफ्नो मोबाइलमा फाइल खोल्नुहोस् र **Install** थिच्नुहोस्।
          files: ${{ steps.locate_apk.outputs.apk_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

