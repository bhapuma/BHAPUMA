name: Build and Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Dependencies & Build Web Client
        run: |
          npm install --legacy-peer-deps
          npx vite build

      - name: Configure Capacitor & Add Android Platform
        run: |
          npm install @capacitor/core@^6.1.0 @capacitor/cli@^6.1.0 @capacitor/android@^6.1.0 --legacy-peer-deps
          
          # Initialize android directory if not present
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          
          # Sync web code
          npx cap sync android

          # Inject necessary hardware & system permissions into AndroidManifest.xml
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            # Insert permissions right before <application
            sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.FLASHLIGHT" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-feature android:name="android.hardware.camera.flash" android:required="false" />\n    <uses-feature android:name="android.hardware.microphone" android:required="false" />' "$MANIFEST"
          fi

      - name: Build Android Debug APK with Gradle
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify and Extract APK
        run: |
          mkdir -p app/build/outputs/apk/debug
          FIND_APK=$(find android -name "*debug*.apk" -type f | head -n 1)
          if [ -z "$FIND_APK" ] || [ ! -f "$FIND_APK" ]; then
            echo "Error: No debug APK found."
            find android -name "*.apk" || true
            exit 1
          fi
          cp "$FIND_APK" app/build/outputs/apk/debug/app-debug.apk
          echo "Found and verified APK at: $FIND_APK"
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_DIR=$(mktemp -d)
          ASSET_NAME="BHAPUMA-AI-Assistant-debug-v${{ github.run_number }}.apk"
          ASSET_PATH="${TEMP_DIR}/${ASSET_NAME}"
          cp app/build/outputs/apk/debug/app-debug.apk "$ASSET_PATH"

          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "Prepared asset: $ASSET_NAME"

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          RELEASE_TAG="v1.0.${{ github.run_number }}"
          RELEASE_TITLE="BHAPUMA AI Assistant v1.0.${{ github.run_number }} (Debug APK)"

          NOTES="## 🤖 BHAPUMA AI Assistant - Android APK Release

**Version:** 1.0.${{ github.run_number }} (Build #${{ github.run_number }})
**Developer:** Bharat Pun Magar ([AVYAN Profile](https://avyan.app/u/bharat.pun.magar))
**Contact:** bhapuma.official@gmail.com

---

### 📥 How to Install on Android:
1. Download the file **\`${{ steps.prepare_asset.outputs.asset_name }}\`** from the **Assets** section below.
2. Tap the downloaded file in your notifications or Downloads folder.
3. Allow **'Install from unknown sources'** if prompted by Android.
4. Launch **BHAPUMA** and speak in Nepali (*'भरत'*, *'भपुम'*, *'ह्याकर'*, *'कम्प्युटर'*)."

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.create_release.outcome }}" = "success" ]; then
            RELEASE_TAG="v1.0.${{ github.run_number }}"
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url -q ".url" || echo "")
            echo "### 🚀 APK Published Successfully to GitHub Releases!" >> $GITHUB_STEP_SUMMARY
            echo "- **Asset Name:** \`${{ steps.prepare_asset.outputs.asset_name }}\`" >> $GITHUB_STEP_SUMMARY
            if [ -n "$RELEASE_URL" ]; then
              echo "- **Direct Download Link:** [Open GitHub Release Page]($RELEASE_URL)" >> $GITHUB_STEP_SUMMARY
            fi
            echo "You can download the APK directly onto your Android device." >> $GITHUB_STEP_SUMMARY
          else
            echo "### 📦 Debug APK Built Successfully!" >> $GITHUB_STEP_SUMMARY
            echo "The APK has been successfully built and uploaded to GitHub Actions Artifacts." >> $GITHUB_STEP_SUMMARY
            echo "You can download **app-debug-apk** directly from the Summary section of this workflow run." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "*Note for Releases*: If you want the APK to appear in GitHub Releases automatically, make sure under **Settings -> Actions -> General -> Workflow permissions**, select **'Read and write permissions'**." >> $GITHUB_STEP_SUMMARY

