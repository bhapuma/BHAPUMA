name: Build and Release Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package.json'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Node Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Web Application
        run: |
          npm run build

      - name: Prepare Capacitor Android Native Project
        run: |
          # Ensure dist directory exists
          if [ ! -d "dist" ]; then
            echo "Error: dist directory does not exist after build."
            exit 1
          fi

          # Add Android platform if not present
          if [ ! -d "android" ]; then
            echo "Adding Capacitor Android platform..."
            npx cap add android
          fi

          # Copy web assets to Android platform
          npx cap sync android

          # Add necessary permissions into AndroidManifest.xml if missing
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if ! grep -q "android.permission.RECORD_AUDIO" "$MANIFEST"; then
              sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.FLASHLIGHT" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />' "$MANIFEST"
            fi
          fi

      - name: Build Android Debug APK with Gradle
        working-directory: android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Find and Verify Generated APK
        id: find_apk
        run: |
          mkdir -p output_apk
          APK_FILE=$(find android -type f -name "*.apk" | grep -i "debug" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find android -type f -name "*.apk" | head -n 1)
          fi

          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "Error: No APK file was generated."
            find android -type f || true
            exit 1
          fi

          FINAL_APK_NAME="BHAPUMA-AI-Assistant-v${{ github.run_number }}.apk"
          cp "$APK_FILE" "output_apk/${FINAL_APK_NAME}"
          echo "apk_path=output_apk/${FINAL_APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${FINAL_APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "Successfully generated APK: ${FINAL_APK_NAME} (Size: $(du -h "$APK_FILE" | cut -f1))"

      - name: Upload APK to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="v1.0.${{ github.run_number }}"
          RELEASE_TITLE="BHAPUMA AI Assistant v1.0.${{ github.run_number }}"
          APK_PATH="${{ steps.find_apk.outputs.apk_path }}"

          NOTES="## 🤖 BHAPUMA AI Assistant - Android APK Release

**Build Version:** 1.0.${{ github.run_number }} (Run #${{ github.run_number }})
**Developer Profile:** Bharat Pun Magar ([AVYAN: avyan.app/u/bharat.pun.magar](https://avyan.app/u/bharat.pun.magar))
**Contact:** bhapuma.official@gmail.com

---

### 📲 How to Install & Use on Android:
1. Download **\`${{ steps.find_apk.outputs.apk_name }}\`** from the **Assets** section below.
2. Tap the downloaded file in your notification bar or file manager.
3. Allow **'Install from unknown sources'** if prompted.
4. Open **BHAPUMA** and speak in Nepali (*'भरत'*, *'भपुम'*, *'ह्याकर'*, *'कम्प्युटर'*)."

          gh release create "$RELEASE_TAG" "$APK_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --latest

      - name: Workflow Summary & Download Guide
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "## 🚀 BHAPUMA Android Build Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.find_apk.outcome }}" = "success" ]; then
            echo "✅ **Debug APK built successfully!**" >> $GITHUB_STEP_SUMMARY
            echo "- **Generated APK:** \`${{ steps.find_apk.outputs.apk_name }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Actions Artifact:** Download \`app-debug-apk\` from the Artifacts section above." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            if [ "${{ steps.create_release.outcome }}" = "success" ]; then
              RELEASE_TAG="v1.0.${{ github.run_number }}"
              RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url -q ".url" 2>/dev/null || echo "")
              if [ -n "$RELEASE_URL" ]; then
                echo "🎉 **GitHub Release is LIVE:** [Click here to Open Release & Download APK]($RELEASE_URL)" >> $GITHUB_STEP_SUMMARY
              fi
            fi
          else
            echo "❌ **APK Build Failed.** Check step logs for details." >> $GITHUB_STEP_SUMMARY
          fi
