name: Build and Release Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies & Build Web Code
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core @capacitor/cli @capacitor/android --save-dev --legacy-peer-deps
          npx vite build

      - name: Setup Capacitor Android
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.bhapuma.assistant",
            "appName": "BHAPUMA",
            "webDir": "dist"
          }
          EOF
          
          # Initialize android directory
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          
          # Sync web build
          npx cap sync android

          # Update AndroidManifest.xml permissions
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.FLASHLIGHT" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />' "$MANIFEST"
          fi

      - name: Compile Debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK File
        id: prepare_apk
        run: |
          mkdir -p output_apk
          APK_PATH=$(find android -type f -name "*debug*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find android -type f -name "*.apk" | head -n 1)
          fi

          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "Error: APK file not found!"
            find android -type f || true
            exit 1
          fi

          APK_FILENAME="BHAPUMA-AI-Assistant-v${{ github.run_number }}.apk"
          cp "$APK_PATH" "output_apk/${APK_FILENAME}"
          echo "apk_path=output_apk/${APK_FILENAME}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${APK_FILENAME}" >> "$GITHUB_OUTPUT"
          echo "Created APK: output_apk/${APK_FILENAME}"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BHAPUMA-Android-APK
          path: ${{ steps.prepare_apk.outputs.apk_path }}
          if-no-files-found: error

      - name: Publish GitHub Release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="v1.0.${{ github.run_number }}"
          TITLE="BHAPUMA AI Assistant v1.0.${{ github.run_number }}"
          FILE="${{ steps.prepare_apk.outputs.apk_path }}"

          BODY="## 🤖 BHAPUMA AI Voice Assistant (Android APK)

**Build Number:** #${{ github.run_number }}
**Developer:** Bharat Pun Magar ([AVYAN Profile](https://avyan.app/u/bharat.pun.magar))
**Email:** bhapuma.official@gmail.com

---

### 📲 How to Download & Install:
1. Tap on **\`${{ steps.prepare_apk.outputs.apk_name }}\`** under the **Assets** section below.
2. Open the downloaded file on your Android mobile.
3. If requested, enable *'Install from unknown sources'*.
4. Open **BHAPUMA** and start speaking in Nepali!"

          gh release create "$TAG_NAME" "$FILE" \
            --title "$TITLE" \
            --notes "$BODY" \
            --latest

      - name: Build Summary
        if: always()
        run: |
          echo "## 🚀 BHAPUMA Android Build Summary" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.prepare_apk.outcome }}" = "success" ]; then
            echo "✅ **Debug APK is Ready!**" >> $GITHUB_STEP_SUMMARY
            echo "- **APK Name:** \`${{ steps.prepare_apk.outputs.apk_name }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Artifacts:** Download \`BHAPUMA-Android-APK\` from the Artifacts list." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ APK build process encountered an issue." >> $GITHUB_STEP_SUMMARY
          fi
