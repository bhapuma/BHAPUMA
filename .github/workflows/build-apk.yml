name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: 📦 Install NPM Dependencies
        run: |
          npm ci || npm install --legacy-peer-deps

      - name: ⚡ Build Web Application Assets
        run: |
          npm run build

      - name: 📱 Sync Capacitor Android Platform
        run: |
          npx cap add android || true
          npx cap sync android

      - name: 🔑 Ensure Android Debug Keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: 🛠️ Make Gradlew Executable & Clean Build
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew clean --no-daemon

      - name: 🚀 Build Android Debug APK
        working-directory: android
        run: |
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: 🔍 Locate & Validate Generated APK
        id: locate_apk
        shell: bash
        run: |
          mkdir -p release-output
          APK_FILE=$(find android/app/build/outputs/apk/debug -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find android -name "*debug*.apk" -o -name "*.apk" | head -n 1)
          fi
          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "::error::Could not find generated APK in android/app/build/outputs/apk!"
            exit 1
          fi
          
          FINAL_NAME="BHAPUMA-AI-Assistant-v1.0.${{ github.run_number }}.apk"
          cp "$APK_FILE" "release-output/$FINAL_NAME"
          
          echo "apk_path=release-output/$FINAL_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_name=$FINAL_NAME" >> "$GITHUB_OUTPUT"
          echo "APK successfully staged at release-output/$FINAL_NAME"

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BHAPUMA-Android-APK
          path: ${{ steps.locate_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      - name: 🏷️ Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Android APK Build (v1.0.${{ github.run_number }})"
          body: |
            ## 🤖 BHAPUMA AI Voice Assistant - Official Android Release

            - **Build:** #${{ github.run_number }}
            - **Commit SHA:** \`${{ github.sha }}\`
            - **Version:** v1.0.${{ github.run_number }}
            - **Architecture:** Universal Android APK (ARM64, ARMv7, x86_64)

            ### 📲 How to Install:
            1. Download **`${{ steps.locate_apk.outputs.apk_name }}`** directly from the **Assets** section below.
            2. Open the downloaded `.apk` file on your Android smartphone.
            3. Tap **Install** (Allow installation from browser/unknown sources if asked).
            4. Open **BHAPUMA** and enjoy the next-gen Nepali Autonomous AI Assistant!
          files: ${{ steps.locate_apk.outputs.apk_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
