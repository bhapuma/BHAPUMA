name: Build and Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Web Application
        run: |
          npm install
          npx vite build

      - name: Set up Capacitor Android Project
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init BHAPUMA com.bhapuma.assistant --web-dir dist
          npx cap add android
          
          # Add necessary Android permissions for voice assistant, camera, flashlight, audio
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.FLASHLIGHT" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' "$MANIFEST"
          fi
          
          npx cap sync android

      - name: Create temporary debug keystore
        run: |
          if [ ! -f "android/app/debug.keystore" ]; then
            echo "Generating temporary debug keystore..."
            keytool -genkey -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
          echo "Debug keystore verified."

      - name: Build Debug APK with Gradle
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          mkdir -p app/build/outputs/apk/debug
          FIND_APK=$(find android/app/build/outputs/apk/debug -name "*debug.apk" -type f | head -n 1)
          if [ -z "$FIND_APK" ] || [ ! -f "$FIND_APK" ]; then
            echo "Error: Debug APK was not generated."
            find android/app/build/outputs -type f || true
            exit 1
          fi
          cp "$FIND_APK" app/build/outputs/apk/debug/app-debug.apk
          echo "APK successfully verified at app/build/outputs/apk/debug/app-debug.apk"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_DIR=$(mktemp -d)
          REPO_CLEAN=$(echo "${{ github.event.repository.name }}" | sed 's/[^a-zA-Z0-9._-]/-/g')
          ASSET_NAME="${REPO_CLEAN:-BHAPUMA}-debug-build-${{ github.run_number }}.apk"
          ASSET_PATH="${TEMP_DIR}/${ASSET_NAME}"
          cp app/build/outputs/apk/debug/app-debug.apk "$ASSET_PATH"

          if [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Failed to prepare release asset."
            exit 1
          fi

          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "Prepared asset: $ASSET_NAME at $ASSET_PATH"

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset missing or empty."
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="BHAPUMA AI Assistant Debug APK #${{ github.run_number }}"

          NOTES="### 🚀 BHAPUMA AI Assistant - Android APK Release
- **App Name**: BHAPUMA AI Voice & System Assistant
- **Developer Profile**: Bharat Pun Magar (AVYAN: avyan.app/u/bharat.pun.magar)
- **Official Email**: bhapuma.official@gmail.com
- **Build Type**: Automatically generated Android Debug APK
- **Workflow Run**: #${{ github.run_number }} (Attempt ${{ github.run_attempt }})
- **Commit SHA**: ${{ github.sha }}

#### 📲 How to Install on Android Phone:
1. Download the \`.apk\` file from the **Assets** section below.
2. Tap the downloaded file on your Android device.
3. Allow *'Install from unknown sources'* if prompted.
4. Open **BHAPUMA** and enjoy continuous voice AI, flashlight, system tools & Nepali AI assistant!"

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.create_release.outcome }}" = "success" ]; then
            RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url -q ".url" || echo "")
            echo "### 🚀 APK Release Published Successfully" >> $GITHUB_STEP_SUMMARY
            echo "- **Release Tag:** \`$RELEASE_TAG\`" >> $GITHUB_STEP_SUMMARY
            echo "- **APK Asset:** \`${{ steps.prepare_asset.outputs.asset_name }}\`" >> $GITHUB_STEP_SUMMARY
            if [ -n "$RELEASE_URL" ]; then
              echo "- **Direct Download Release Page:** [Open GitHub Release Page]($RELEASE_URL)" >> $GITHUB_STEP_SUMMARY
            fi
            echo "You can download the \`.apk\` directly onto your Android phone from the GitHub Release Assets section." >> $GITHUB_STEP_SUMMARY
            echo "A backup copy is also preserved in GitHub Actions Artifacts (\`app-debug-apk\`)." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⚠️ GitHub Release Publishing Note" >> $GITHUB_STEP_SUMMARY
            echo "Debug APK build and GitHub Actions artifact upload succeeded." >> $GITHUB_STEP_SUMMARY
            echo "You can download the APK from the Actions run artifacts (\`app-debug-apk\`)." >> $GITHUB_STEP_SUMMARY
          fi
