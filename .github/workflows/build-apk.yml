name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Node Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Web Dist
        run: |
          npx vite build

      - name: Setup Capacitor Android
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.bhapuma.assistant",
            "appName": "BHAPUMA",
            "webDir": "dist"
          }
          EOF
          npx cap add android || true
          npx cap sync android
          chmod +x android/gradlew

      - name: Build Android APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon

      - name: Locate APK File
        id: find_apk
        run: |
          mkdir -p build_output
          APK_PATH=$(find android/app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find android -type f -name "*.apk" | head -n 1)
          fi
          if [ -z "$APK_PATH" ]; then
            echo "Error: APK not found"
            exit 1
          fi
          APK_NAME="BHAPUMA-AI-Assistant.apk"
          cp "$APK_PATH" "build_output/${APK_NAME}"
          echo "apk_path=build_output/${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BHAPUMA-AI-Assistant-APK
          path: ${{ steps.find_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" "${{ steps.find_apk.outputs.apk_path }}" \
            --title "BHAPUMA AI Assistant v1.0.${{ github.run_number }}" \
            --notes "Android APK for BHAPUMA AI Assistant" \
            --latest || echo "Release creation skipped or succeeded"
