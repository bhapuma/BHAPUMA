name: Build and Release Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Web Application
        run: |
          npm install --legacy-peer-deps
          npx vite build

      - name: Setup Android Project via Capacitor
        run: |
          npx cap add android || true
          npx cap sync android

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if ! grep -q "android.permission.RECORD_AUDIO" "$MANIFEST"; then
              sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.FLASHLIGHT" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />' "$MANIFEST"
            fi
          fi

      - name: Build APK with Gradle Wrapper
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Locate and Prepare Output APK
        id: prepare_apk
        run: |
          mkdir -p output_apk
          APK_FOUND=$(find android/app/build/outputs/apk -type f -name "*debug*.apk" | head -n 1)
          if [ -z "$APK_FOUND" ]; then
            APK_FOUND=$(find android -type f -name "*.apk" | head -n 1)
          fi

          if [ -z "$APK_FOUND" ] || [ ! -f "$APK_FOUND" ]; then
            echo "Error: APK not generated."
            exit 1
          fi

          APK_NAME="BHAPUMA-AI-Assistant-v${{ github.run_number }}.apk"
          cp "$APK_FOUND" "output_apk/${APK_NAME}"
          echo "apk_path=output_apk/${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "Generated APK: ${APK_NAME}"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ steps.prepare_apk.outputs.apk_path }}
          if-no-files-found: error

      - name: Publish Release to GitHub
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="v1.0.${{ github.run_number }}"
          TITLE="BHAPUMA AI Assistant v1.0.${{ github.run_number }}"
          FILE_PATH="${{ steps.prepare_apk.outputs.apk_path }}"

          RELEASE_BODY="## 🤖 BHAPUMA AI Voice Assistant (Android APK)

**Build:** # ${{ github.run_number }}
**Developer:** Bharat Pun Magar ([AVYAN Profile](https://avyan.app/u/bharat.pun.magar))
**Contact:** bhapuma.official@gmail.com

---

### 📲 Mobile Download & Installation Instructions:
1. Go to the **Assets** section below.
2. Tap and download **\`${{ steps.prepare_apk.outputs.apk_name }}\`**.
3. Open the APK file on your Android phone and install.
4. Launch **BHAPUMA**!"

          gh release create "$TAG_NAME" "$FILE_PATH" \
            --title "$TITLE" \
            --notes "$RELEASE_BODY" \
            --latest

      - name: Build Summary
        if: always()
        run: |
          echo "## 🚀 BHAPUMA APK Build Summary" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.prepare_apk.outcome }}" = "success" ]; then
            echo "✅ **Debug APK is ready!**" >> $GITHUB_STEP_SUMMARY
            echo "- **Filename:** \`${{ steps.prepare_apk.outputs.apk_name }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Artifacts:** Download \`app-debug-apk\` from the run artifacts." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ APK compilation encountered an error." >> $GITHUB_STEP_SUMMARY
          fi
